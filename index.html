<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Blog</title>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

    <!-- CONNECT CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h1>☕ Cozy Book Notes</h1>
    <p>soft thoughts & honest reviews</p>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#">Reviews</a>
    <a href="#">Favorites</a>
</nav>

<div class="container" id="blogContainer">

    <div class="post">
        <h2>Book Title</h2>
        <p>Book reviwess ketuuu </p>
        <button onclick="likePost(this)">♡ Like</button>

        <div class="comment-section">
            <div class="comments"></div>

            <div class="comment-input">
                <input type="text" placeholder="leave a cute comment...">
                <button onclick="addComment(this)">Post</button>
            </div>
        </div>
    </div>

</div>

<footer>
    made with love 📖
</footer>

<!-- CONNECT JS -->
<script src="js/script.js"></script>

</body>
</html>
