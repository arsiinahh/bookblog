<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dea Writes</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/write.css">
</head>
<body>

<!-- PASSWORD SCREEN -->
<div id="loginScreen">
    <div class="login-box">
        <h2>☕ Dea's Corner</h2>
        <form id="loginForm">
            <input id="emailInput" type="text" placeholder="Email" required>
            <input id="passwordInput" type="password" placeholder="Password" required>
            <button type="submit">Log in</button>
            <p id="loginError" style="color:red;"></p>
        </form>
    </div>
</div>

<!-- WRITE REVIEW SCREEN -->
<div id="writeScreen" style="display:none;">
    <header>
        <h1>☕ Dea Writes</h1>
        <p>your cozy review corner</p>
    </header>

    <div class="container">
        <div class="post">
            <h2>New Review</h2>

            <label>Book Title</label>
            <input type="text" id="bookTitle" placeholder="e.g. The Secret History">

            <label>Cover Image URL</label>
            <input type="text" id="coverImage" placeholder="paste an image link...">
            <img id="coverPreview" src="" alt="" style="max-width:120px; margin:8px 0; border-radius:8px; display:none;">

            <label>Star Rating</label>
            <div class="star-picker" id="starPicker">
                <span onclick="setRating(1)">★</span>
                <span onclick="setRating(2)">★</span>
                <span onclick="setRating(3)">★</span>
                <span onclick="setRating(4)">★</span>
                <span onclick="setRating(5)">★</span>
            </div>

            <label>Your Review</label>
            <div class="editor-wrapper">
                <div class="editor-toolbar">
                    <button onclick="fmt2('bold')"><b>B</b></button>
                    <button onclick="fmt2('italic')"><i>I</i></button>
                    <button onclick="fmt2('underline')"><u>U</u></button>
                    <button onclick="fmt2('insertOrderedList')">≡</button>
                    <select onchange="fmt2('foreColor', this.value); this.selectedIndex=0;">
                        <option value="">Color</option>
                        <option value="#8B5E3C">Brown</option>
                        <option value="#c0392b">Red</option>
                        <option value="#2980b9">Blue</option>
                        <option value="#27ae60">Green</option>
                        <option value="#8e44ad">Purple</option>
                    </select>
                    <select onchange="fmt2('formatBlock', this.value); this.selectedIndex=0;">
                        <option value="">Heading</option>
                        <option value="H1">H1</option>
                        <option value="H2">H2</option>
                        <option value="H3">H3</option>
                        <option value="p">Normal</option>
                    </select>
                </div>
                <div class="editor-box" contenteditable="true" id="reviewBox" data-placeholder="write your review here..."></div>
            </div>

            <button class="post-btn" onclick="submitReview()" style="margin-top:12px;">Publish Review ✨</button>
            <p id="successMsg" style="color:#27ae60; display:none;">Review published! 🎉</p>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import {
        getAuth,
        signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDk80SSAkgFbhHaGAM5Q9pu8Lpz6fPemiE",
      authDomain: "deas-bookblog.firebaseapp.com",
      projectId: "deas-bookblog",
      storageBucket: "deas-bookblog.firebasestorage.app",
      messagingSenderId: "510960037167",
      appId: "1:510960037167:web:fdb238a97415e0903985da"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const db = getFirestore(app);

    async function loginUser(email, password) {


       if (!email) {
            showLoginError("Unknown username.");
            return;
        }
 try {
            const userCredential = await signInWithEmailAndPassword(auth, email, password);
            console.log("Logged in as:", userCredential.user.email);
            onLoginSuccess(userCredential.user);
        } catch (error) {
            console.error("Login failed:", error.code);
            showLoginError("Incorrect username or password.");
        }
    }

    function onLoginSuccess(user) {
        // TODO: show whatever admin content should appear after login
        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('writeScreen').style.display = 'block';
    }

    function showLoginError(message) {
        const errorEl = document.getElementById('loginError');
        if (errorEl) errorEl.textContent = message;
    }

    // wire it up to your form
    document.getElementById('loginForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('emailInput').value.trim();
        const password = document.getElementById('passwordInput').value;
        loginUser(email, password);
    });

    // STAR RATING
    let currentRating = 0;
    window.setRating = function(n) {
      currentRating = n;
      const stars = document.querySelectorAll('#starPicker span');
      stars.forEach((s, i) => s.style.color = i < n ? '#c9a96e' : '#ccc');
    }

    // RICH TEXT
    window.fmt2 = function(command, value = null) {
      document.execCommand(command, false, value);
      document.getElementById('reviewBox').focus();
    }

    // COVER PREVIEW
    document.getElementById('coverImage').addEventListener('input', function() {
      const preview = document.getElementById('coverPreview');
      if (this.value) {
        preview.src = this.value;
        preview.style.display = 'block';
      } else {
        preview.style.display = 'none';
      }
    });

    // SUBMIT
    window.submitReview = async function() {
  // block if not logged in
  if (!auth.currentUser) {
    alert('You must be logged in to submit a review.');
    return;
  }

  const title = document.getElementById('bookTitle').value.trim();
  const cover = document.getElementById('coverImage').value.trim();
  const review = document.getElementById('reviewBox').innerHTML.trim();

  if (!title || !review || currentRating === 0) {
    alert('Please fill in the title, rating and review!');
    return;
  }

  try {
    await addDoc(collection(db, "reviews"), {
      title, cover, rating: currentRating, review,
      createdAt: serverTimestamp(),
      authorUid: auth.currentUser.uid   // optional but useful — tracks who posted it
    });

    document.getElementById('successMsg').style.display = 'block';
    document.getElementById('bookTitle').value = '';
    document.getElementById('coverImage').value = '';
    document.getElementById('reviewBox').innerHTML = '';
    document.getElementById('coverPreview').style.display = 'none';
    window.setRating(0);
    setTimeout(() => document.getElementById('successMsg').style.display = 'none', 3000);
  } catch(e) {
    alert('Error saving review: ' + e.message);
  }
}
</script>

</body>
</html>
